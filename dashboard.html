<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Catalyst Hub Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:white;
padding:25px;
overflow-x:hidden;
}

/* Topbar */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:15px;
}

.topbar h1{
font-size:42px;
font-weight:700;
}

#currentDate{
font-size:16px;
color:#aaa;
background:#111;
padding:12px 18px;
border-radius:14px;
}

/* Cards */

.glass{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
padding:25px;
border-radius:24px;
margin-bottom:25px;
box-shadow:0 0 25px rgba(255,255,255,0.03);
}

/* Countdown */

.countdown-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:20px;
margin-bottom:25px;
}

.time-card{
text-align:center;
}

.time-card h2{
font-size:50px;
margin-bottom:10px;
}

.time-card p{
color:#aaa;
}

/* Planner */

.todo-input{
width:100%;
padding:15px;
margin-bottom:14px;
border:none;
border-radius:14px;
background:#121212;
color:white;
font-size:15px;
outline:none;
}

/* Buttons */

.btn{
padding:14px 25px;
border:none;
border-radius:14px;
background:linear-gradient(to right,#2563eb,#3b82f6);
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:0.3s;
margin:5px;
}

.btn:hover{
transform:translateY(-3px);
}

/* Pomodoro */

.timer-display{
font-size:70px;
text-align:center;
margin:20px 0;
font-weight:700;
}

.timer-buttons{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:15px;
}

.small-btn{
padding:12px 18px;
border:none;
border-radius:12px;
background:#121212;
color:white;
cursor:pointer;
transition:0.3s;
}

.small-btn:hover{
background:white;
color:black;
}

/* Grid */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

/* PDF */

iframe{
margin-top:20px;
border-radius:18px;
}

/* Responsive */

@media(max-width:700px){

.topbar h1{
font-size:32px;
}

.timer-display{
font-size:55px;
}

}
.logout-btn{
background:linear-gradient(to right,#dc2626,#ef4444);
}

</style>
</head>

<body>

<!-- Topbar -->

<div class="topbar">

<h1>The Catalyst Hub</h1>

<div id="currentDate">
Loading Date...
</div>

</div>

<a href="/logout">

<button class="btn logout-btn">
Logout
</button>

</a>
<!-- Countdown -->

<div class="countdown-grid">

<div class="glass time-card">
<h2 id="days">0</h2>
<p>Days</p>
</div>

<div class="glass time-card">
<h2 id="hours">0</h2>
<p>Hours</p>
</div>

<div class="glass time-card">
<h2 id="minutes">0</h2>
<p>Minutes</p>
</div>

<div class="glass time-card">
<h2 id="seconds">0</h2>
<p>Seconds</p>
</div>

</div>

<!-- Study Planner -->

<div class="glass">

<h2>Study Planner</h2>

<br>

<input class="todo-input" type="text" placeholder="Chapter Name">

<input class="todo-input" type="text" placeholder="Topic Name">

<input class="todo-input" type="text" placeholder="Target Questions">

<input class="todo-input" type="text" placeholder="Revision Topic">

<button class="btn">
Save Study Plan
</button>

</div>

<!-- Pomodoro -->

<div class="glass">

<h2>Pomodoro Timer</h2>

<div class="timer-display" id="timer">
25:00
</div>

<div class="timer-buttons">

<button class="small-btn" onclick="setTimer(25)">
25 Min
</button>

<button class="small-btn" onclick="setTimer(52)">
52 Min
</button>

<button class="small-btn" onclick="setTimer(17)">
17 Break
</button>

</div>


<center>

<button class="btn" onclick="startTimer()">
Start
</button>

<button class="btn" onclick="stopTimer()">
Stop
</button>

<button class="btn" onclick="resetTimer()">
Reset
</button>

</center>

</div>

<!-- Subject Trackers -->

<div class="grid">

<div class="glass">

<h2>Physics Tracker</h2>

<br>

<input class="todo-input" type="text" placeholder="Physics Chapter">

<input class="todo-input" type="text" placeholder="Physics Topic">

<input class="todo-input" type="text" placeholder="Target Questions">

<button class="btn">
Save Physics
</button>

</div>

<div class="glass">

<h2>Chemistry Tracker</h2>

<br>

<input class="todo-input" type="text" placeholder="Chemistry Chapter">

<input class="todo-input" type="text" placeholder="Chemistry Topic">

<input class="todo-input" type="text" placeholder="Target Questions">

<button class="btn">
Save Chemistry
</button>

</div>

<div class="glass">

<h2>Maths Tracker</h2>

<br>

<input class="todo-input" type="text" placeholder="Maths Chapter">

<input class="todo-input" type="text" placeholder="Maths Topic">

<input class="todo-input" type="text" placeholder="Target Questions">

<button class="btn">
Save Maths
</button>

</div>

</div>

<script>

/* Date */

function updateDate(){

const today = new Date();

const options = {
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
};

document.getElementById("currentDate").innerHTML =
today.toLocaleDateString('en-US', options);

}

updateDate();

setInterval(updateDate,1000);

/* Countdown */

const targetDate =
new Date("Jan 21, 2027 00:00:00").getTime();

setInterval(() => {

const now = new Date().getTime();

const distance = targetDate - now;

document.getElementById("days").innerHTML =
Math.floor(distance / (1000*60*60*24));

document.getElementById("hours").innerHTML =
Math.floor((distance % (1000*60*60*24)) / (1000*60*60));

document.getElementById("minutes").innerHTML =
Math.floor((distance % (1000*60*60)) / (1000*60));

document.getElementById("seconds").innerHTML =
Math.floor((distance % (1000*60)) / 1000);

},1000);

/* Pomodoro */

let countdown;
let time = 1500;

function setTimer(minutes){

time = minutes * 60;

updateDisplay();

}

function startTimer(){

clearInterval(countdown);

countdown = setInterval(() => {

if(time <= 0){

clearInterval(countdown);

alert("Session Complete!");

}

else{

time--;

updateDisplay();

}

},1000);

}

function stopTimer(){

clearInterval(countdown);

}

function resetTimer(){

clearInterval(countdown);

time = 1500;

updateDisplay();

}

function updateDisplay(){

let mins = Math.floor(time / 60);

let secs = time % 60;

document.getElementById("timer").innerHTML =
`${mins}:${secs < 10 ? '0' : ''}${secs}`;

}



</script>

</body>
</html>
