<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catalyst Hub Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

/* Background */

.blur1,
.blur2{
position:fixed;
width:400px;
height:400px;
border-radius:50%;
filter:blur(130px);
z-index:-1;
}

.blur1{
background:#2563eb;
top:-100px;
left:-100px;
opacity:0.3;
}

.blur2{
background:#7c3aed;
bottom:-100px;
right:-100px;
opacity:0.3;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 6%;
position:sticky;
top:0;
background:rgba(5,8,22,0.75);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,0.08);
z-index:999;
}

.logo{
font-size:30px;
font-weight:800;
background:linear-gradient(to right,#fff,#60a5fa);
background-clip:text;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.top-info{
display:flex;
gap:20px;
align-items:center;
flex-wrap:wrap;
}

.clock-box{
background:rgba(255,255,255,0.05);
padding:12px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.08);
font-size:14px;
}

/* Layout */

.dashboard{
padding:40px 6%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

/* Cards */

.card{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:30px;
backdrop-filter:blur(14px);
transition:0.3s;
}

.card:hover{
transform:translateY(-6px);
border-color:#3b82f6;
}

.card h2{
font-size:24px;
margin-bottom:20px;
}

/* Progress */

.progress-box{
margin-bottom:20px;
}

.progress-title{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.progress-bar{
width:100%;
height:14px;
background:#111827;
border-radius:20px;
overflow:hidden;
}

.progress{
height:100%;
background:linear-gradient(to right,#2563eb,#8b5cf6);
border-radius:20px;
}

/* Timer */

.timer{
font-size:60px;
font-weight:700;
text-align:center;
margin:25px 0;
}

.timer-buttons{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:14px 24px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.start{
background:#2563eb;
color:white;
}

.stop{
background:#ef4444;
color:white;
}

.reset{
background:#10b981;
color:white;
}

.btn:hover{
transform:translateY(-3px);
}

/* Inputs */

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
outline:none;
border-radius:14px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
color:white;
}

/* Tasks */

.task-list{
margin-top:15px;
}

.task{
background:#0f172a;
padding:14px;
border-radius:14px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.task button{
background:red;
border:none;
padding:8px 12px;
border-radius:10px;
color:white;
cursor:pointer;
}

/* Stats */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:0 6% 50px;
}

.stat-card{
background:rgba(255,255,255,0.04);
padding:25px;
border-radius:24px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.stat-card h1{
font-size:42px;
margin-bottom:10px;
background:linear-gradient(to right,#60a5fa,#8b5cf6);
background-clip:text;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.stat-card p{
color:#9ca3af;
}

/* Export */

.export-btn{
width:100%;
background:linear-gradient(to right,#2563eb,#7c3aed);
color:white;
padding:16px;
border:none;
border-radius:16px;
font-weight:600;
cursor:pointer;
margin-top:20px;
}

/* Responsive */

@media(max-width:700px){

nav{
flex-direction:column;
gap:20px;
padding:20px;
}

.timer{
font-size:42px;
}

}

</style>
</head>

<body>

<div class="blur1"></div>
<div class="blur2"></div>

<!-- Navbar -->

<nav>

<div class="logo">
Catalyst Hub
</div>

<div class="top-info">

<div class="clock-box" id="date">
Date
</div>

<div class="clock-box" id="time">
Time
</div>

</div>

</nav>

<!-- Stats -->

<section class="stats">

<div class="stat-card">
<h1 id="studyHours">0</h1>
<p>Study Hours</p>
</div>

<div class="stat-card">
<h1 id="tasksDone">0</h1>
<p>Tasks Completed</p>
</div>

<div class="stat-card">
<h1 id="focusSessions">0</h1>
<p>Focus Sessions</p>
</div>

<div class="stat-card">
<h1 id="progressPercent">0%</h1>
<p>Total Progress</p>
</div>
<div class="stat-card">
<h1 id="timerHours">0</h1>
<p>Total Focus Minutes</p>
</div>

<div class="stat-card">
<h1 id="completedPomodoros">0</h1>
<p>Completed Pomodoros</p>
</div>

<div class="stat-card">
<h1 id="todayFocus">0h</h1>
<p>Today's Focus Time</p>
</div>
</section>

<!-- Dashboard -->

<section class="dashboard">

<!-- Progress Tracker -->

<div class="card">

<h2>📈 Subject Progress</h2>

<div class="progress-box">
<div class="progress-title">
<span>Physics</span>
<span>80%</span>
</div>

<div class="progress-bar">
<div class="progress" style="width:80%"></div>
</div>
</div>

<div class="progress-box">
<div class="progress-title">
<span>Chemistry</span>
<span>65%</span>
</div>

<div class="progress-bar">
<div class="progress" style="width:65%"></div>
</div>
</div>

<div class="progress-box">
<div class="progress-title">
<span>Mathematics</span>
<span>72%</span>
</div>

<div class="progress-bar">
<div class="progress" style="width:72%"></div>
</div>
</div>

<canvas id="progressChart"></canvas>

</div>

<!-- Pomodoro -->

<!-- Pomodoro -->

<div class="card">

<h2>⏳ Smart Pomodoro Timer</h2>

<div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">

<button class="btn start" onclick="setCustomTime(25)">
25 Min
</button>

<button class="btn start" onclick="setCustomTime(45)">
45 Min
</button>

<button class="btn start" onclick="setCustomTime(60)">
60 Min
</button>

<button class="btn start" onclick="openCustomTime()">
Custom
</button>

</div>

<div id="customTimeBox" style="display:none; margin-bottom:20px;">

<input 
type="number" 
id="customMinutes" 
placeholder="Enter Custom Minutes">

<button class="btn start" onclick="applyCustomTime()">
Apply Time
</button>

</div>

<div class="timer" id="timer">
25:00
</div>

<div class="timer-buttons">

<button class="btn start" onclick="startTimer()">
Start
</button>

<button class="btn stop" onclick="stopTimer()">
Stop
</button>

<button class="btn reset" onclick="resetTimer()">
Reset
</button>

</div>

</div>

</div>

<!-- Task Tracker -->

<div class="card">

<h2>✅ Daily Task Tracker</h2>

<input type="text" id="taskInput" placeholder="Add Study Task">

<button class="btn start" onclick="addTask()">
Add Task
</button>

<div class="task-list" id="taskList"></div>

<button class="export-btn" onclick="exportExcel()">
Export Data To Excel
</button>

</div>

</section>

<script>

/* Date & Time */

function updateClock(){

const now = new Date();

document.getElementById("date").innerHTML =
now.toDateString();

document.getElementById("time").innerHTML =
now.toLocaleTimeString();

}

setInterval(updateClock,1000);

/* Timer */

/* Timer */

let countdown;
let totalSeconds = 1500;
let defaultTime = 1500;

function updateTimer(){

let minutes = Math.floor(totalSeconds / 60);
let seconds = totalSeconds % 60;

document.getElementById("timer").innerHTML =
`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

}

/* Set Preset Time */

function setCustomTime(minutes){

defaultTime = minutes * 60;
totalSeconds = defaultTime;

updateTimer();

}

/* Open Custom Input */

function openCustomTime(){

document.getElementById("customTimeBox").style.display = "block";

}

/* Apply Custom Time */

function applyCustomTime(){

let customMinutes =
document.getElementById("customMinutes").value;

if(customMinutes <= 0 || customMinutes === ""){
return;
}

defaultTime = customMinutes * 60;

totalSeconds = defaultTime;

updateTimer();

}

/* Start */

function startTimer(){

clearInterval(countdown);

countdown = setInterval(()=>{

if(totalSeconds <= 0){

clearInterval(countdown);

alert("🎉 Focus Session Completed!");

document.getElementById("focusSessions").innerHTML =
parseInt(document.getElementById("focusSessions").innerHTML)+1;

return;
}

totalSeconds--;

updateTimer();

},1000);

}

/* Stop */

function stopTimer(){

clearInterval(countdown);

}

/* Reset */

function resetTimer(){

clearInterval(countdown);

totalSeconds = defaultTime;

updateTimer();

}

updateTimer();
/* Task Tracker */

let tasksDone = 0;

function addTask(){

let taskInput =
document.getElementById("taskInput");

let taskText = taskInput.value;

if(taskText === "") return;

let taskDiv = document.createElement("div");

taskDiv.classList.add("task");

taskDiv.innerHTML = `
<span>${taskText}</span>
<button onclick="completeTask(this)">Done</button>
`;

document.getElementById("taskList").appendChild(taskDiv);

taskInput.value = "";

}

function completeTask(button){

button.parentElement.remove();

tasksDone++;

document.getElementById("tasksDone").innerHTML = tasksDone;

updateProgress();

}

/* Progress */

function updateProgress(){

let progress = Math.min(tasksDone * 10,100);

document.getElementById("progressPercent").innerHTML =
progress + "%";

}

/* Study Hours Auto */

let studyHours = 0;

setInterval(()=>{

studyHours += 1;

document.getElementById("studyHours").innerHTML =
studyHours;

},60000);

/* Chart */

new Chart(document.getElementById("progressChart"),{

type:'bar',

data:{
labels:['Physics','Chemistry','Maths'],
datasets:[{
label:'Progress',
data:[80,65,72],
borderWidth:1
}]
}

});

/* Excel Export */

function exportExcel(){

let wb = XLSX.utils.book_new();

let data = [

["Study Hours",
document.getElementById("studyHours").innerHTML],

["Tasks Completed",
document.getElementById("tasksDone").innerHTML],

["Focus Sessions",
document.getElementById("focusSessions").innerHTML],

["Progress",
document.getElementById("progressPercent").innerHTML]

];

let ws = XLSX.utils.aoa_to_sheet(data);

XLSX.utils.book_append_sheet(wb,ws,"Dashboard Data");

XLSX.writeFile(wb,"CatalystHubData.xlsx");

}

updateClock();
updateTimer();

</script>

</body>
</html>
